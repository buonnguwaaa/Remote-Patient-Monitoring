name: Mobile Android Build (EAS)

# Build Android APKs using Expo EAS (Internal Distribution)
# Requirements:
# - EXPO_TOKEN secret must be configured
# - EXPO_PUBLIC_BASE_URL or BASE_URL secret must be set (do not use localhost)

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - patient-app
          - doctor-app

jobs:
  build-patient-app:
    name: EAS Build – Patient App (Android APK)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.app == 'both' ||
      github.event.inputs.app == 'patient-app'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: Frontend/mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate API URL
        env:
          EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_BASE_URL" ] && [ -z "$BASE_URL" ]; then
            echo "Error: Missing API URL configuration for APK build."
            echo "Please configure EXPO_PUBLIC_BASE_URL or BASE_URL in GitHub Secrets."
            echo "Note: Using 'localhost' will fail on physical devices."
            exit 1
          fi

      - name: EAS Build Android APK (preview)
        working-directory: Frontend/mobile
        env:
          EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

  build-doctor-app:
    name: EAS Build – Doctor/Staff App (Android APK)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.app == 'both' ||
      github.event.inputs.app == 'doctor-app'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/doctor-app/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: Frontend/doctor-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate API URL
        env:
          EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_BASE_URL" ] && [ -z "$BASE_URL" ]; then
            echo "Error: Missing API URL configuration for APK build."
            echo "Please configure EXPO_PUBLIC_BASE_URL or BASE_URL in GitHub Secrets."
            echo "Note: Using 'localhost' will fail on physical devices."
            exit 1
          fi

      - name: EAS Build Android APK (preview)
        working-directory: Frontend/doctor-app
        env:
          EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

