services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
    ports:
      - "7233:7233"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped

  server:
    image: buonnguwaaa/rpm-backend:latest
    command: ["/server"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal:7233
      REDIS_ADDR: redis:6379
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    image: buonnguwaaa/rpm-backend:latest
    command: ["/worker"]
    env_file:
      - .env
    environment:
      TEMPORAL_HOST: temporal:7233
      REDIS_ADDR: redis:6379
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: buonnguwaaa/rpm-nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - server
    restart: unless-stopped

volumes:
  temporal-postgres-data: