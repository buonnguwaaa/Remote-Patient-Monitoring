basePath: /
definitions:
  domain.BloodPressure:
    properties:
      diastolic:
        type: number
      map:
        type: number
      systolic:
        type: number
    type: object
  domain.FollowUpAppointmentStatus:
    enum:
    - scheduled
    - completed
    - canceled
    type: string
    x-enum-varnames:
    - FollowUpAppointmentStatusScheduled
    - FollowUpAppointmentStatusCompleted
    - FollowUpAppointmentStatusCanceled
  domain.Glucose:
    properties:
      bloodGlucose:
        description: mg/dL
        type: number
    type: object
  domain.Kind:
    enum:
    - measure
    - medication
    type: string
    x-enum-varnames:
    - KindMeasure
    - KindMedication
  domain.MealTiming:
    enum:
    - pre_meal
    - post_meal
    type: string
    x-enum-varnames:
    - MealTimingPreMeal
    - MealTimingPostMeal
  domain.PrescriptionStatus:
    enum:
    - active
    - completed
    - discontinued
    - expired
    type: string
    x-enum-varnames:
    - PrescriptionStatusActive
    - PrescriptionStatusCompleted
    - PrescriptionStatusDiscontinued
    - PrescriptionStatusExpired
  domain.ReminderStatus:
    enum:
    - active
    - paused
    - expired
    - canceled
    type: string
    x-enum-varnames:
    - ReminderStatusActive
    - ReminderStatusPaused
    - ReminderStatusExpired
    - ReminderStatusCanceled
  domain.Status:
    enum:
    - open
    - ack
    type: string
    x-enum-varnames:
    - StatusOpen
    - StatusAck
  domain.TimeOfDay:
    enum:
    - morning
    - noon
    - evening
    type: string
    x-enum-varnames:
    - TimeOfDayMorning
    - TimeOfDayNoon
    - TimeOfDayEvening
  dto.ActivateAccountRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - email
    - otp
    type: object
  dto.ActivityLogListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.ActivityLogResponse'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.ActivityLogResponse:
    properties:
      action:
        type: string
      createdAt:
        type: string
      date:
        description: YYYY-MM-DD format
        type: string
      errorMsg:
        type: string
      id:
        type: string
      ipAddress:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      method:
        type: string
      path:
        type: string
      resource:
        type: string
      resourceId:
        type: string
      statusCode:
        type: integer
      timestamp:
        description: HH:MM format
        type: string
      type:
        type: string
      userId:
        type: string
      userName:
        type: string
      userRole:
        type: string
    type: object
  dto.ActivityLogStatsResponse:
    properties:
      byType:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total:
        type: integer
    type: object
  dto.AssignPatientRequest:
    properties:
      doctorId:
        description: Can be empty if only assigning nurse
        type: string
      nurseId:
        description: Can be empty if only assigning doctor
        type: string
      patientId:
        type: string
    required:
    - patientId
    type: object
  dto.CreateConversationRequest:
    properties:
      participantIds:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - participantIds
    type: object
  dto.CreateFollowUpAppointmentRequest:
    properties:
      doctorId:
        type: string
      location:
        type: string
      notes:
        type: string
      patientId:
        type: string
      scheduledAt:
        type: string
      timezone:
        type: string
    required:
    - patientId
    - scheduledAt
    - timezone
    type: object
  dto.CreateMeasurementRequest:
    properties:
      bloodPressure:
        $ref: '#/definitions/domain.BloodPressure'
      device:
        type: string
      glucose:
        $ref: '#/definitions/domain.Glucose'
      heartRate:
        type: number
      height:
        type: number
      mealTiming:
        allOf:
        - $ref: '#/definitions/domain.MealTiming'
        enum:
        - pre_meal
        - post_meal
      note:
        type: string
      patientId:
        type: string
      respiratoryRate:
        type: number
      spo2:
        type: number
      temperature:
        type: number
      weight:
        type: number
    required:
    - patientId
    type: object
  dto.CreateMedicationIntakeRequest:
    properties:
      dose:
        $ref: '#/definitions/dto.MedicationDoseRequest'
      drugName:
        type: string
      prescriptionId:
        type: string
    required:
    - dose
    - drugName
    - prescriptionId
    type: object
  dto.CreatePrescriptionRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      medications:
        items:
          $ref: '#/definitions/dto.PrescriptionMedicationRequest'
        minItems: 1
        type: array
      patientId:
        type: string
      startDate:
        type: string
      timezone:
        type: string
    required:
    - daysOfWeek
    - medications
    - patientId
    - startDate
    - timezone
    type: object
  dto.CreateReminderRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      hour:
        maximum: 23
        minimum: 0
        type: integer
      kind:
        $ref: '#/definitions/domain.Kind'
      mealTiming:
        allOf:
        - $ref: '#/definitions/domain.MealTiming'
        enum:
        - pre_meal
        - post_meal
      message:
        type: string
      minute:
        maximum: 59
        minimum: 0
        type: integer
      patientId:
        type: string
      startDate:
        type: string
      timezone:
        type: string
    required:
    - daysOfWeek
    - endDate
    - kind
    - message
    - patientId
    - startDate
    - timezone
    type: object
  dto.CreateThresholdRequest:
    properties:
      diaMax:
        type: number
      diaMin:
        type: number
      doctorId:
        type: string
      effectiveFrom:
        type: string
      effectiveTo:
        type: string
      glucoseMax:
        type: number
      glucoseMin:
        type: number
      heartRateMax:
        type: number
      heartRateMin:
        type: number
      patientId:
        type: string
      respiratoryRateMax:
        type: number
      respiratoryRateMin:
        type: number
      spo2Min:
        type: number
      sysMax:
        type: number
      sysMin:
        type: number
      temperatureMax:
        type: number
      temperatureMin:
        type: number
    required:
    - effectiveFrom
    - patientId
    type: object
  dto.CreateVideoSessionRequest:
    properties:
      conversationId:
        type: string
      patientId:
        type: string
    required:
    - patientId
    type: object
  dto.DeactivateNotificationTokenRequest:
    properties:
      deviceId:
        type: string
    required:
    - deviceId
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LogoutRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.MedicationDoseRequest:
    properties:
      hour:
        maximum: 23
        minimum: 0
        type: integer
      mealTiming:
        allOf:
        - $ref: '#/definitions/domain.MealTiming'
        enum:
        - pre_meal
        - post_meal
      minute:
        maximum: 59
        minimum: 0
        type: integer
      pillCount:
        type: number
      timeOfDay:
        allOf:
        - $ref: '#/definitions/domain.TimeOfDay'
        enum:
        - morning
        - noon
        - evening
    required:
    - pillCount
    - timeOfDay
    type: object
  dto.PrescriptionMedicationRequest:
    properties:
      dosage:
        type: string
      drugName:
        type: string
      instructions:
        type: string
      route:
        type: string
      schedule:
        items:
          $ref: '#/definitions/dto.MedicationDoseRequest'
        minItems: 1
        type: array
    required:
    - dosage
    - drugName
    - schedule
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterNotificationTokenRequest:
    properties:
      deviceId:
        type: string
      platform:
        type: string
      provider:
        type: string
      token:
        type: string
    required:
    - deviceId
    - platform
    - provider
    - token
    type: object
  dto.RegisterRequest:
    properties:
      confirmedPassword:
        example: SecurePass123!
        minLength: 8
        type: string
      dob:
        example: "1990-05-15"
        type: string
      email:
        example: john.doe@example.com
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/user.Gender'
        example: M
      name:
        example: John Doe
        type: string
      password:
        example: SecurePass123!
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/user.Role'
        example: patient
    required:
    - confirmedPassword
    - dob
    - email
    - gender
    - name
    - password
    - role
    type: object
  dto.ResendActivationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      confirmedNewPassword:
        minLength: 6
        type: string
      email:
        example: john.doe@example.com
        type: string
      newPassword:
        minLength: 6
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - confirmedNewPassword
    - email
    - newPassword
    - otp
    type: object
  dto.UpdateBaseUserRequest:
    properties:
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdateDepartmentRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.UpdateDoctorRequest:
    properties:
      departmentId:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      licenseNumber:
        type: string
      name:
        type: string
      phone:
        type: string
      specialization:
        type: string
      workplace:
        type: string
      yearsOfExperience:
        type: integer
    type: object
  dto.UpdateFollowUpAppointmentRequest:
    properties:
      location:
        type: string
      notes:
        type: string
      scheduledAt:
        type: string
      timezone:
        type: string
    type: object
  dto.UpdateFollowUpAppointmentStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/domain.FollowUpAppointmentStatus'
        enum:
        - scheduled
        - completed
        - canceled
    required:
    - status
    type: object
  dto.UpdateMeasurementRequest:
    properties:
      bloodPressure:
        $ref: '#/definitions/domain.BloodPressure'
      device:
        type: string
      glucose:
        $ref: '#/definitions/domain.Glucose'
      heartRate:
        type: number
      height:
        type: number
      mealTiming:
        $ref: '#/definitions/domain.MealTiming'
      note:
        type: string
      respiratoryRate:
        type: number
      spo2:
        type: number
      temperature:
        type: number
      weight:
        type: number
    type: object
  dto.UpdateMyPatientProfileRequest:
    properties:
      cccd:
        type: string
      diseaseTypes:
        $ref: '#/definitions/user.DiseaseTypes'
      emergencyContactName:
        type: string
      emergencyContactPhone:
        type: string
      insuranceNumber:
        type: string
      medicalHistory:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  dto.UpdateNurseRequest:
    properties:
      departmentId:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      licenseNumber:
        type: string
      name:
        type: string
      phone:
        type: string
      workplace:
        type: string
      yearsOfExperience:
        type: integer
    type: object
  dto.UpdatePatientRequest:
    properties:
      cccd:
        type: string
      diseaseTypes:
        $ref: '#/definitions/user.DiseaseTypes'
      email:
        type: string
      emergencyContactName:
        type: string
      emergencyContactPhone:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      insuranceNumber:
        type: string
      medicalHistory:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdatePrescriptionRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      medications:
        items:
          $ref: '#/definitions/dto.PrescriptionMedicationRequest'
        minItems: 1
        type: array
      startDate:
        type: string
      status:
        $ref: '#/definitions/domain.PrescriptionStatus'
      timezone:
        type: string
    required:
    - daysOfWeek
    - medications
    - startDate
    - status
    - timezone
    type: object
  dto.UpdatePrescriptionStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.PrescriptionStatus'
    required:
    - status
    type: object
  dto.UpdateReminderRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      hour:
        maximum: 23
        minimum: 0
        type: integer
      message:
        type: string
      minute:
        maximum: 59
        minimum: 0
        type: integer
      startDate:
        type: string
      status:
        $ref: '#/definitions/domain.ReminderStatus'
      timezone:
        type: string
    required:
    - daysOfWeek
    - endDate
    - message
    - startDate
    - status
    - timezone
    type: object
  dto.UpdateReminderStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.ReminderStatus'
    required:
    - status
    type: object
  dto.UpdateThresholdRequest:
    properties:
      diaMax:
        type: number
      diaMin:
        type: number
      effectiveFrom:
        type: string
      effectiveTo:
        type: string
      glucoseMax:
        type: number
      glucoseMin:
        type: number
      heartRateMax:
        type: number
      heartRateMin:
        type: number
      respiratoryRateMax:
        type: number
      respiratoryRateMin:
        type: number
      spo2Min:
        type: number
      sysMax:
        type: number
      sysMin:
        type: number
      temperatureMax:
        type: number
      temperatureMin:
        type: number
    type: object
  dto.UpdateUserStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.Status'
    required:
    - status
    type: object
  usecase.CreateDepartmentInput:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  user.DiseaseTypes:
    properties:
      bloodPressure:
        type: boolean
      glucose:
        type: boolean
    type: object
  user.Gender:
    enum:
    - M
    - F
    - O
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  user.Role:
    enum:
    - user.patient
    - user.doctor
    - user.nurse
    - admin
    type: string
    x-enum-varnames:
    - RolePatient
    - RoleDoctor
    - RoleNurse
    - RoleAdmin
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A REST API for remote patient monitoring system
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Remote Patient Monitoring API
  version: "1.0"
paths:
  /activity-logs:
    get:
      consumes:
      - application/json
      description: Get activity logs with optional filters
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      - description: Activity type (login, create, update, delete, system, all)
        in: query
        name: type
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityLogListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get activity logs
      tags:
      - activity-logs
  /activity-logs/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an activity log by ID
      parameters:
      - description: Activity Log ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a specific activity log
      tags:
      - activity-logs
  /activity-logs/cleanup-access:
    delete:
      consumes:
      - application/json
      description: Delete all system logs with "Truy cập:" action (GET request logs)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Clean up access logs
      tags:
      - activity-logs
  /activity-logs/stats:
    get:
      consumes:
      - application/json
      description: Get statistics for activity logs within a date range
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityLogStatsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get activity log statistics
      tags:
      - activity-logs
  /alerts/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve an alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an alert by ID
      tags:
      - alerts
  /alerts/ack/{id}:
    patch:
      consumes:
      - application/json
      description: Update the acknowledgement of an alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert acknowledged successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Acknowledge an alert
      tags:
      - alerts
  /alerts/doctors/me:
    get:
      consumes:
      - application/json
      description: Retrieve all alerts for patients assigned to the authenticated
        doctor
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get doctor patient alerts
      tags:
      - alerts
  /alerts/nurses/me:
    get:
      consumes:
      - application/json
      description: Retrieve all alerts for patients assigned to the authenticated
        nurse
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get nurse patient alerts
      tags:
      - alerts
  /alerts/patients/me:
    get:
      consumes:
      - application/json
      description: Retrieve all alerts for the authenticated patient
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get patient alerts
      tags:
      - alerts
  /appointments:
    get:
      consumes:
      - application/json
      description: Get follow-up appointments filtered by patient, status, or date
        range. Doctors default to their own schedule.
      parameters:
      - description: Patient ID
        in: query
        name: patientId
        type: string
      - description: Appointment status (scheduled, completed, canceled)
        in: query
        name: status
        type: string
      - description: Start of date range (RFC3339)
        in: query
        name: from
        type: string
      - description: End of date range (RFC3339)
