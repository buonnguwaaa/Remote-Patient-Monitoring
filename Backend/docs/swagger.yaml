basePath: /
definitions:
  domain.BloodPressure:
    properties:
      diastolic:
        type: number
      map:
        type: number
      systolic:
        type: number
    type: object
  domain.Kind:
    enum:
    - measure
    - medication
    type: string
    x-enum-varnames:
    - KindMeasure
    - KindMedication
  domain.MeasurementType:
    enum:
    - bp
    - glucose
    type: string
    x-enum-varnames:
    - TypeBloodPressure
    - TypeGlucose
  domain.ReminderStatus:
    enum:
    - active
    - paused
    - expired
    - canceled
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusPaused
    - StatusExpired
    - StatusCanceled
  domain.Status:
    enum:
    - open
    - ack
    type: string
    x-enum-varnames:
    - StatusOpen
    - StatusAck
  domain.Timing:
    enum:
    - pre
    - post
    type: string
    x-enum-varnames:
    - TimingPre
    - TimingPost
  dto.ActivateAccountRequest:
    properties:
      activateToken:
        type: string
    required:
    - activateToken
    type: object
  dto.AssignPatientRequest:
    properties:
      doctorId:
        description: Can be empty if only assigning nurse
        type: string
      nurseId:
        description: Can be empty if only assigning doctor
        type: string
      patientId:
        type: string
    required:
    - patientId
    type: object
  dto.CreateConversationRequest:
    properties:
      participantIds:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - participantIds
    type: object
  dto.CreateMeasurementRequest:
    properties:
      bloodPressure:
        $ref: '#/definitions/domain.BloodPressure'
      device:
        type: string
      glucose:
        type: number
      heartRate:
        type: number
      note:
        type: string
      patientId:
        type: string
      respiratoryRate:
        type: number
      spo2:
        type: number
      temperature:
        type: number
      timing:
        allOf:
        - $ref: '#/definitions/domain.Timing'
        enum:
        - pre
        - post
      type:
        allOf:
        - $ref: '#/definitions/domain.MeasurementType'
        enum:
        - bp
        - glucose
    required:
    - patientId
    - type
    type: object
  dto.CreateReminderRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      hour:
        maximum: 23
        minimum: 0
        type: integer
      kind:
        $ref: '#/definitions/domain.Kind'
      message:
        type: string
      minute:
        maximum: 59
        minimum: 0
        type: integer
      patientId:
        type: string
      startDate:
        type: string
      timezone:
        type: string
    required:
    - daysOfWeek
    - endDate
    - kind
    - message
    - patientId
    - startDate
    - timezone
    type: object
  dto.CreateThresholdRequest:
    properties:
      diaMax:
        type: number
      diaMin:
        type: number
      doctorId:
        type: string
      effectiveFrom:
        type: string
      effectiveTo:
        type: string
      glucoseMax:
        type: number
      glucoseMin:
        type: number
      heartRateMax:
        type: number
      heartRateMin:
        type: number
      patientId:
        type: string
      respiratoryRateMax:
        type: number
      respiratoryRateMin:
        type: number
      spo2Min:
        type: number
      sysMax:
        type: number
      sysMin:
        type: number
      temperatureMax:
        type: number
      temperatureMin:
        type: number
    required:
    - effectiveFrom
    - patientId
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LogoutRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterRequest:
    properties:
      confirmedPassword:
        example: SecurePass123!
        minLength: 8
        type: string
      dob:
        example: "1990-05-15"
        type: string
      email:
        example: john.doe@example.com
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/user.Gender'
        example: M
      name:
        example: John Doe
        type: string
      password:
        example: SecurePass123!
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/user.Role'
        example: patient
    required:
    - confirmedPassword
    - dob
    - email
    - gender
    - name
    - password
    - role
    type: object
  dto.ResendActivationEmailRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      confirmedNewPassword:
        minLength: 6
        type: string
      newPassword:
        minLength: 6
        type: string
      resetToken:
        type: string
    required:
    - confirmedNewPassword
    - newPassword
    - resetToken
    type: object
  dto.UpdateBaseUserRequest:
    properties:
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdateDoctorRequest:
    properties:
      departmentId:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      licenseNumber:
        type: string
      name:
        type: string
      phone:
        type: string
      specialization:
        type: string
      workplace:
        type: string
      yearsOfExperience:
        type: integer
    type: object
  dto.UpdateMeasurementRequest:
    properties:
      bloodPressure:
        $ref: '#/definitions/domain.BloodPressure'
      device:
        type: string
      glucose:
        type: number
      heartRate:
        type: number
      note:
        type: string
      respiratoryRate:
        type: number
      spo2:
        type: number
      temperature:
        type: number
      timing:
        $ref: '#/definitions/domain.Timing'
      type:
        allOf:
        - $ref: '#/definitions/domain.MeasurementType'
        enum:
        - bp
        - glucose
    type: object
  dto.UpdateMyPatientProfileRequest:
    properties:
      cccd:
        type: string
      emergencyContactName:
        type: string
      emergencyContactPhone:
        type: string
      insuranceNumber:
        type: string
      medicalHistory:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  dto.UpdateNurseRequest:
    properties:
      departmentId:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      licenseNumber:
        type: string
      name:
        type: string
      phone:
        type: string
      ward:
        type: string
      workplace:
        type: string
    type: object
  dto.UpdatePatientRequest:
    properties:
      cccd:
        type: string
      email:
        type: string
      emergencyContactName:
        type: string
      emergencyContactPhone:
        type: string
      gender:
        $ref: '#/definitions/user.Gender'
      insuranceNumber:
        type: string
      medicalHistory:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdateReminderRequest:
    properties:
      daysOfWeek:
        items:
          type: integer
        type: array
      endDate:
        type: string
      hour:
        maximum: 23
        minimum: 0
        type: integer
      message:
        type: string
      minute:
        maximum: 59
        minimum: 0
        type: integer
      startDate:
        type: string
      status:
        $ref: '#/definitions/domain.ReminderStatus'
      timezone:
        type: string
    required:
    - daysOfWeek
    - endDate
    - message
    - startDate
    - status
    - timezone
    type: object
  dto.UpdateReminderStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.ReminderStatus'
    required:
    - status
    type: object
  dto.UpdateThresholdRequest:
    properties:
      diaMax:
        type: number
      diaMin:
        type: number
      effectiveFrom:
        type: string
      effectiveTo:
        type: string
      glucoseMax:
        type: number
      glucoseMin:
        type: number
      heartRateMax:
        type: number
      heartRateMin:
        type: number
      respiratoryRateMax:
        type: number
      respiratoryRateMin:
        type: number
      spo2Min:
        type: number
      sysMax:
        type: number
      sysMin:
        type: number
      temperatureMax:
        type: number
      temperatureMin:
        type: number
    type: object
  dto.UpdateUserStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.Status'
    required:
    - status
    type: object
  usecase.CreateDepartmentInput:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  user.Gender:
    enum:
    - M
    - F
    - O
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  user.Role:
    enum:
    - user.patient
    - user.doctor
    - user.nurse
    - admin
    type: string
    x-enum-varnames:
    - RolePatient
    - RoleDoctor
    - RoleNurse
    - RoleAdmin
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A REST API for remote patient monitoring system
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Remote Patient Monitoring API
  version: "1.0"
paths:
  /alerts/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve an alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an alert by ID
      tags:
      - alerts
  /alerts/ack/{id}:
    patch:
      consumes:
      - application/json
      description: Update the acknowledgement of an alert by its ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert acknowledged successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Acknowledge an alert
      tags:
      - alerts
  /alerts/doctors/me:
    get:
      consumes:
      - application/json
      description: Retrieve all alerts for patients assigned to the authenticated
        doctor
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get doctor patient alerts
      tags:
      - alerts
  /alerts/patients/me:
    get:
      consumes:
      - application/json
      description: Retrieve all alerts for the authenticated patient
      produces:
      - application/json
      responses:
        "200":
          description: Alerts retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get patient alerts
      tags:
      - alerts
  /assignments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all assignments (admin only)
      tags:
      - assignments
  /assignments/{id}:
    delete:
      parameters:
      - description: Assignment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Assignment deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an assignment by ID
      tags:
      - assignments
  /assignments/assign:
    post:
      consumes:
      - application/json
      description: Create or update an assignment between a patient and medical staff
      parameters:
      - description: Assignment info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AssignPatientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Assignment created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assign patient to doctor/nurse
      tags:
      - assignments
  /assignments/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get assignments for the current doctor/nurse
      tags:
      - assignments
  /auth/activate:
    post:
      description: Activate user account created from local strategy using token from
        email link
      parameters:
      - description: Activation token
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ActivateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account activated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Activate account
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send reset link to user email
      parameters:
      - description: Email
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset password link was sent to your mailbox
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot Password
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Handle Google OAuth2 callback and generate JWT, unified with LoginResponse
      parameters:
      - description: Google Auth Code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Google Callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Redirect user to Google OAuth2 login
      responses:
        "302":
          description: Redirect
          schema:
            type: string
      summary: Google Login
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token and clear session
      parameters:
      - description: Logout request (falls back to cookies)
        in: body
        name: logout
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Retrieve information about the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User information retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get authenticated user info
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provide a refresh token to obtain a new access token
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided details
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/resend-activation:
    post:
      consumes:
      - application/json
      description: Resend account activation email to user
      parameters:
      - description: Email
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ResendActivationEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Activation email resent successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Activation Email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: "Reset password using va\tlid token"
      parameters:
      - description: New password
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset Password
      tags:
      - auth
  /chat/conversations:
    get:
      consumes:
      - application/json
      parameters:
      - description: Number of conversations to retrieve
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Conversations retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get user conversations
      tags:
      - chat
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation info
        in: body
        name: conversation
        required: true
        schema:
          $ref: '#/definitions/dto.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Conversation created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new conversation
      tags:
      - chat
  /chat/conversations/{id}/messages:
    get:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Number of messages to retrieve
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get conversation messages
      tags:
      - chat
  /chat/ws:
    get:
      consumes:
