basePath: /
definitions:
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.LogoutRequest:
    properties:
      refreshToken:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterRequest:
    properties:
      confirmedPassword:
        example: SecurePass123!
        minLength: 8
        type: string
      dob:
        example: "1990-05-15"
        type: string
      email:
        example: john.doe@example.com
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/users.Gender'
        example: M
      name:
        example: John Doe
        type: string
      password:
        example: SecurePass123!
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/users.Role'
        example: patient
    required:
    - confirmedPassword
    - dob
    - email
    - gender
    - name
    - password
    - role
    type: object
  dto.ResetPasswordRequest:
    properties:
      confirmPassword:
        type: string
      newPassword:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - confirmPassword
    - newPassword
    - token
    type: object
  users.Gender:
    enum:
    - M
    - F
    - O
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  users.Role:
    enum:
    - patient
    - doctor
    type: string
    x-enum-varnames:
    - RolePatient
    - RoleDoctor
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A REST API for remote patient monitoring system
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Remote Patient Monitoring API
  version: "1.0"
paths:
  /auth/activate/{email}:
    get:
      description: Activate user account by email after registration
      parameters:
      - description: Email
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account activated
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Activate account
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send reset link to user email
      parameters:
      - description: Email
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset link sent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Forgot Password
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Handle Google OAuth2 callback and generate JWT, unified with LoginResponse
      parameters:
      - description: Google Auth Code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Google Callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Redirect user to Google OAuth2 login
      responses:
        "302":
          description: Redirect
          schema:
            type: string
      summary: Google Login
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User logged in successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token and clear session
      parameters:
      - description: Logout request (falls back to cookies)
        in: body
        name: logout
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Provide a refresh token to obtain a new access token
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with the provided details
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using valid token
      parameters:
      - description: New password
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset Password
      tags:
      - auth
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Get a user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
